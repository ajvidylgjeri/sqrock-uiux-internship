<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AegisOps · Cybersecurity Dashboard (UI/UX prototype)</title>
<style>
:root{--r:12px;--font:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
[data-theme=dark]{--bg:#0A0F1C;--panel:#111A2E;--panel2:#16213A;--line:#23304F;--text:#E6ECFA;--muted:#8D9BBA;--accent:#38BDF8;--accent2:#6366F1;--crit:#FF5C7A;--high:#FF9F43;--med:#F5D547;--low:#34D399;--glass:rgba(17,26,46,.65)}
[data-theme=light]{--bg:#F1F5FB;--panel:#FFFFFF;--panel2:#F6F8FD;--line:#DCE3F0;--text:#0F1A33;--muted:#5B6987;--accent:#0369A1;--accent2:#4F46E5;--crit:#C81E4B;--high:#B45309;--med:#8A6D00;--low:#047857;--glass:rgba(255,255,255,.7)}
*{box-sizing:border-box;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:10px;align-items:center;font-weight:700;font-size:17px;padding:4px 10px 18px}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-size:17px}
.nav a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500}
.nav a:hover{background:var(--panel2);color:var(--text)}
.nav a.on{background:linear-gradient(90deg,rgba(56,189,248,.18),transparent);color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.nav .ico{width:20px;text-align:center}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px}
.main{min-width:0}
.top{display:flex;gap:14px;align-items:center;padding:14px 26px;border-bottom:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5}
.top h1{font-size:20px;flex:0 0 auto}
.search{flex:1;max-width:420px;margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--text);font:inherit}
.iconbtn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;width:38px;height:38px;position:relative}
.dot{position:absolute;top:6px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--crit);box-shadow:0 0 0 2px var(--panel2)}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent));display:grid;place-items:center;color:#fff;font-weight:700}
.content{padding:24px 26px 40px;display:grid;gap:18px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1.6fr 1fr}.g2e{grid-template-columns:1fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h3{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.card h3 small{color:var(--muted);font-weight:400}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.5px}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .d{font-size:12px;margin-top:6px}
.up{color:var(--crit)}.down{color:var(--low)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid}
.Critical{color:var(--crit);border-color:var(--crit);background:color-mix(in srgb,var(--crit) 14%,transparent)}
.High{color:var(--high);border-color:var(--high);background:color-mix(in srgb,var(--high) 14%,transparent)}
.Medium{color:var(--med);border-color:var(--med);background:color-mix(in srgb,var(--med) 14%,transparent)}
.Low,.ok{color:var(--low);border-color:var(--low);background:color-mix(in srgb,var(--low) 14%,transparent)}
.off{color:var(--muted);border-color:var(--line)}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 14px;border-radius:10px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#fff}
.btn.danger{border-color:var(--crit);color:var(--crit)}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.tablewrap{overflow-x:auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.muted{color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-weight:600;font-size:13px}
.chip.on{color:var(--accent);border-color:var(--accent)}
.bar{height:8px;border-radius:9px;background:var(--panel2);overflow:hidden}.bar>i{display:block;height:100%;border-radius:9px;background:var(--accent)}
.timeline{display:grid;gap:0;position:relative;padding-left:22px}
.timeline:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl{position:relative;padding:0 0 16px}
.tl:before{content:"";position:absolute;left:-21px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--panel)}
.tl.c:before{background:var(--crit)}.tl.g:before{background:var(--low)}
.tl b{display:block}.tl span{color:var(--muted);font-size:12px}
.heat{display:grid;grid-template-columns:repeat(24,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;display:block}
.switch{width:44px;height:24px;border-radius:99px;background:var(--line);border:0;position:relative;flex:0 0 auto}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--accent)}.switch.on:after{left:23px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border:0}
input.f,select.f{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;width:100%}
label.l{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px;font-weight:600}
.panel{position:fixed;top:64px;right:20px;width:340px;max-width:calc(100vw - 40px);z-index:20;background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.panel .n{padding:10px 0;border-bottom:1px solid var(--line)}.panel .n:last-child{border:0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--accent);padding:11px 18px;border-radius:12px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--crit);animation:pulse 1.4s infinite;margin-right:6px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,92,122,.6)}100%{box-shadow:0 0 0 10px rgba(255,92,122,0)}}
@media (prefers-reduced-motion:reduce){.live{animation:none}}
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:radial-gradient(900px 500px at 20% 10%,rgba(99,102,241,.35),transparent),radial-gradient(700px 500px at 90% 90%,rgba(56,189,248,.3),transparent),var(--panel);padding:48px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--line)}
.hero h2{font-size:36px;line-height:1.15;max-width:460px}
.formside{display:grid;place-items:center;padding:30px}
.form{width:100%;max-width:380px}
.form h2{font-size:26px;margin-bottom:4px}
.code{display:flex;gap:8px}.code input{width:100%;text-align:center;font-size:22px;padding:12px 0}
.tabs{display:none}
.ds .sw{height:64px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:flex-end;padding:6px 8px;font-size:11px;color:#fff;font-weight:600}
@media (max-width:1100px){
 .app{grid-template-columns:72px 1fr}.side{padding:14px 8px}.nav a span.t,.brand span.t,.side .foot{display:none}.nav a{justify-content:center}.brand{justify-content:center;padding-inline:0}
 .g4{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr 1fr}.content{padding:18px}
}
@media (max-width:760px){
 .app{grid-template-columns:1fr}.side{display:none}.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
 .tabs a{padding:7px 12px;border-radius:99px;background:var(--panel2);white-space:nowrap;color:var(--muted)}.tabs a.on{color:var(--accent)}
 .g4,.g3,.g2,.g2e{grid-template-columns:1fr}.top{padding:12px 14px}.search{display:none}.login{grid-template-columns:1fr}.hero{display:none}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ---------- deterministic data ---------- */
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const sevs=['Critical','High','Medium','Low'];
const cats=['Malware','Phishing','Brute force','DDoS','Data exfiltration','Ransomware','Insider threat'];
const hosts=['WS-ACC-014','SRV-DB-02','SRV-WEB-01','LT-HR-221','WS-DEV-087','SRV-MAIL-01','IOT-CAM-12','FW-EDGE-01','LT-CEO-001','SRV-FILE-03'];
const analysts=['Elira Hoxha','Marko Petrov','Dea Krasniqi','Ardit Balla'];
const threatTitles=[['Ransomware behaviour on file server','Ransomware','SRV-FILE-03','Critical'],['Credential stuffing against VPN gateway','Brute force','FW-EDGE-01','High'],['Phishing link clicked by finance user','Phishing','LT-HR-221','High'],['Outbound traffic to known C2 domain','Malware','WS-DEV-087','Critical'],['Large data transfer to unknown IP','Data exfiltration','SRV-DB-02','High'],['SYN flood on public web server','DDoS','SRV-WEB-01','Medium'],['Unusual after-hours admin login','Insider threat','LT-CEO-001','Medium'],['Outdated firmware on IP camera','Malware','IOT-CAM-12','Low'],['Suspicious macro in email attachment','Phishing','SRV-MAIL-01','Medium'],['Repeated failed SSH logins','Brute force','SRV-WEB-01','Low']];
const threats=threatTitles.map((t,i)=>({id:'INC-'+(2041+i),title:t[0],cat:t[1],host:t[2],sev:t[3],time:`${String(8+i).padStart(2,'0')}:${String((i*17)%60).padStart(2,'0')}`,status:['Open','Investigating','Contained','Open','Investigating','Open','Open','Resolved','Contained','Resolved'][i],analyst:analysts[i%4]}));
const devices=hosts.map((h,i)=>({name:h,type:h.startsWith('SRV')?'Server':h.startsWith('FW')?'Firewall':h.startsWith('IOT')?'IoT':h.startsWith('LT')?'Laptop':'Workstation',ip:`10.0.${i+1}.${20+i*7}`,health:[96,71,88,64,92,79,45,99,83,90][i],online:![6,3].includes(i),vul:[0,3,1,5,0,2,7,0,1,0][i]}));
const users=[['Elira Hoxha','Security Admin','Active','Today 09:12'],['Marko Petrov','Analyst','Active','Today 08:47'],['Dea Krasniqi','Analyst','Active','Yesterday'],['Ardit Balla','Auditor','Invited','—'],['Sara Morina','Read-only','Suspended','12 days ago']];
const tr=(n,f)=>Array.from({length:n},(_,i)=>f(i));
/* ---------- tiny chart helpers (SVG) ---------- */
function line(vals,w=560,h=170,color='var(--accent)',fill=true){const max=Math.max(...vals)*1.1,min=0;const pts=vals.map((v,i)=>[i*(w-20)/(vals.length-1)+10,h-14-(v-min)/(max-min)*(h-28)]);const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Line chart">${[0,1,2,3].map(i=>`<line x1="10" x2="${w-10}" y1="${14+i*(h-28)/3}" y2="${14+i*(h-28)/3}" stroke="var(--line)" stroke-dasharray="3 4"/>`).join('')}${fill?`<path d="${d} L${pts.at(-1)[0]} ${h-14} L10 ${h-14}Z" fill="${color}" opacity=".13"/>`:''}<path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${pts.filter((_,i)=>i%Math.ceil(vals.length/8)==0).map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${color}"/>`).join('')}</svg>`}
function bars(vals,labels,color='var(--accent2)',w=560,h=170){const max=Math.max(...vals)*1.15,bw=(w-20)/vals.length;return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Bar chart">${vals.map((v,i)=>{const bh=v/max*(h-40);return `<rect x="${10+i*bw+bw*.18}" y="${h-24-bh}" width="${bw*.64}" height="${bh}" rx="5" fill="${color}"><title>${labels[i]}: ${v}</title></rect><text x="${10+i*bw+bw/2}" y="${h-7}" font-size="11" text-anchor="middle" fill="var(--muted)">${labels[i]}</text>`}).join('')}</svg>`}
function donut(parts,size=150){const total=parts.reduce((a,p)=>a+p[1],0);let a0=-Math.PI/2;const R=size/2-12,c=size/2;const arcs=parts.map(p=>{const a1=a0+p[1]/total*Math.PI*2;const large=a1-a0>Math.PI?1:0;const d=`M${c+R*Math.cos(a0)} ${c+R*Math.sin(a0)} A${R} ${R} 0 ${large} 1 ${c+R*Math.cos(a1-.02)} ${c+R*Math.sin(a1-.02)}`;a0=a1;return `<path d="${d}" fill="none" stroke="${p[2]}" stroke-width="16" stroke-linecap="round"><title>${p[0]}: ${p[1]}</title></path>`}).join('');return `<svg viewBox="0 0 ${size} ${size}" width="${size}" role="img" aria-label="Donut chart">${arcs}<text x="${c}" y="${c+2}" text-anchor="middle" font-size="24" font-weight="700" fill="var(--text)">${total}</text><text x="${c}" y="${c+18}" text-anchor="middle" font-size="11" fill="var(--muted)">total</text></svg>`}
function heat(){seed=11;return `<div class="heat">${tr(24*7,i=>{const h=i%24,v=rnd()*(h>=1&&h<=5?1.4:.7);const c=v>.95?'var(--crit)':v>.7?'var(--high)':v>.4?'var(--med)':'var(--panel2)';return `<i style="background:${c};opacity:${v>.4?.9:1}" title="Day ${Math.floor(i/24)+1}, ${h}:00"></i>`}).join('')}</div><div class="row muted" style="margin-top:8px;font-size:12px">0:00 <span style="flex:1;border-top:1px dashed var(--line)"></span> 23:00 · darker = fewer events, red = peak attack activity</div>`}
const pill=s=>`<span class="pill ${s}">${s}</span>`;
const stat=s=>`<span class="pill ${s==='Resolved'||s==='Contained'?'ok':s==='Open'?'High':'Medium'}">${s}</span>`;
/* ---------- app state ---------- */
const S={route:location.hash.slice(2)||'login',theme:'dark',notif:false,twofa:false,q:'',sev:'All',cat:'All',range:'12m',toast:''};
const NAV=[['dashboard','▦','Dashboard'],['threats','⚠','Threats'],['network','🖧','Network'],['reports','📈','Reports'],['users','👥','Users'],['settings','⚙','Settings']];
function go(r){location.hash='#/'+r}
addEventListener('hashchange',()=>{S.route=location.hash.slice(2)||'login';S.notif=false;render()});
function toast(m){S.toast=m;render();setTimeout(()=>{S.toast='';render()},2200)}
function setTheme(t){S.theme=t;document.documentElement.dataset.theme=t;render()}
/* ---------- screens ---------- */
function login(){return `<div class="login"><div class="hero"><div class="brand"><div class="logo">🛡</div>AegisOps</div><div><h2>See every threat before it becomes an incident.</h2><p class="muted" style="margin-top:14px;max-width:420px">Unified monitoring for endpoints, network and identities, built for security analysts and administrators.</p></div><div class="row muted"><span class="pill ok">● All systems operational</span><span>SOC 2 · ISO 27001 aligned (concept)</span></div></div>
<div class="formside"><form class="form" onsubmit="event.preventDefault();${S.twofa?'':'S.twofa=true;render();return false;'}go('dashboard')">${S.twofa?`<h2>Two-factor check</h2><p class="muted">Enter the 6-digit code from your authenticator app.</p><label class="l">Verification code</label><div class="code">${tr(6,i=>`<input class="f" maxlength="1" inputmode="numeric" aria-label="Digit ${i+1}" value="${'428613'[i]}">`).join('')}</div><div style="margin-top:20px"><button class="btn primary" style="width:100%">Verify & sign in</button></div><p class="muted" style="margin-top:14px;font-size:12px">Prototype: any code works. <a href="#/login" onclick="S.twofa=false" style="color:var(--accent)">Back</a></p>`
:`<h2>Welcome back</h2><p class="muted">Sign in to the security console.</p><label class="l" for="u">Email or username</label><input id="u" class="f" value="elira.hoxha@aegisops.io" autocomplete="username"><label class="l" for="p">Password</label><input id="p" class="f" type="password" value="••••••••••" autocomplete="current-password"><div class="row spread" style="margin:14px 0 18px"><label class="row"><input type="checkbox" checked> Remember me</label><a href="#/login" style="color:var(--accent)" onclick="toast('Reset link sent (demo)')">Forgot password?</a></div><button class="btn primary" style="width:100%">Log in</button><p class="muted" style="margin-top:14px;font-size:12px">Two-factor authentication is required for administrators.</p>`}</form></div></div>`}
function dashboard(){seed=3;const net=tr(24,i=>40+Math.round(Math.sin(i/3)*18+rnd()*25));
return `<div class="grid g4">
<div class="card kpi"><div class="l">Total security alerts (24h)</div><div class="v">1,284</div><div class="d up">▲ 8.2% vs yesterday</div></div>
<div class="card kpi"><div class="l"><span class="live"></span>Active threats</div><div class="v" style="color:var(--crit)">17</div><div class="d muted">3 critical · 5 high</div></div>
<div class="card kpi"><div class="l">Risk score</div><div class="v" style="color:var(--high)">62<small class="muted" style="font-size:14px"> / 100</small></div><div class="bar" style="margin-top:8px"><i style="width:62%;background:var(--high)"></i></div></div>
<div class="card kpi"><div class="l">System health</div><div class="v" style="color:var(--low)">94%</div><div class="d down">▼ 2 services degraded</div></div></div>
<div class="grid g2"><div class="card"><h3>Threat detection <small>last 24 hours</small></h3>${line(tr(24,i=>20+Math.round(Math.abs(Math.sin(i/2.4))*40+rnd()*30)))}</div>
<div class="card"><h3>Security score</h3><div class="row" style="gap:20px">${donut([['Critical',3,'var(--crit)'],['High',5,'var(--high)'],['Medium',6,'var(--med)'],['Low',3,'var(--low)']])}<div style="display:grid;gap:8px">${[['Critical',3],['High',5],['Medium',6],['Low',3]].map(x=>`<div class="row">${pill(x[0])}<b>${x[1]}</b></div>`).join('')}</div></div></div></div>
<div class="grid g3"><div class="card"><h3>Network activity <small>Mbps</small></h3>${line(net,360,130,'var(--accent2)')}</div>
<div class="card"><h3>Firewall status</h3>${[['Edge firewall','ok','Active'],['Web app firewall','ok','Active'],['Internal segment','Medium','Rule update pending'],['VPN gateway','High','Elevated attempts']].map(x=>`<div class="setrow"><span>${x[0]}</span><span class="pill ${x[1]}">${x[2]}</span></div>`).join('')}</div>
<div class="card"><h3>Device status</h3><div class="row spread"><div><div class="kpi"><div class="v">${devices.filter(d=>d.online).length}<small class="muted" style="font-size:14px"> online</small></div></div><div class="muted">${devices.filter(d=>!d.online).length} offline · ${devices.reduce((a,d)=>a+d.vul,0)} vulnerabilities</div></div>${donut([['Online',8,'var(--low)'],['Offline',2,'var(--line)']],110)}</div></div></div>
<div class="grid g2"><div class="card"><h3>Recent incidents <a href="#/threats" style="color:var(--accent);font-weight:500">View all →</a></h3><div class="tablewrap"><table><tr><th>ID</th><th>Incident</th><th>Severity</th><th>Status</th></tr>${threats.slice(0,5).map(t=>`<tr class="click" onclick="go('incident/${t.id}')"><td>${t.id}</td><td>${t.title}</td><td>${pill(t.sev)}</td><td>${stat(t.status)}</td></tr>`).join('')}</table></div></div>
<div class="card"><h3>User activity <small>events by hour · 7 days</small></h3>${heat()}</div></div>`}
function threatsView(){const list=threats.filter(t=>(S.sev==='All'||t.sev===S.sev)&&(S.cat==='All'||t.cat===S.cat)&&(t.title+t.host+t.id).toLowerCase().includes(S.q.toLowerCase()));
return `<div class="grid g4">${sevs.map(s=>`<div class="card kpi"><div class="l">${pill(s)}</div><div class="v">${threats.filter(t=>t.sev===s).length}</div></div>`).join('')}</div>
<div class="card"><div class="row spread" style="margin-bottom:12px"><input class="f" style="max-width:340px" placeholder="Search threats, hosts, IDs…" value="${S.q}" oninput="S.q=this.value;render(true)" id="tq" aria-label="Search threats"><div class="chips">${['All',...sevs].map(s=>`<button class="chip ${S.sev===s?'on':''}" onclick="S.sev='${s}';render()">${s}</button>`).join('')}</div><select class="f" style="max-width:190px" onchange="S.cat=this.value;render()" aria-label="Category">${['All',...cats].map(c=>`<option ${S.cat===c?'selected':''}>${c}</option>`).join('')}</select></div>
<div class="tablewrap"><table><tr><th>ID</th><th>Threat</th><th>Category</th><th>Affected device</th><th>Detected</th><th>Severity</th><th>Status</th></tr>${list.map(t=>`<tr class="click" onclick="go('incident/${t.id}')"><td>${t.id}</td><td><b>${t.title}</b></td><td>${t.cat}</td><td>${t.host}</td><td>${t.time}</td><td>${pill(t.sev)}</td><td>${stat(t.status)}</td></tr>`).join('')||`<tr><td colspan="7" class="muted" style="padding:30px;text-align:center">No threats match these filters.</td></tr>`}</table></div></div>
<div class="grid g2e"><div class="card"><h3>Detection timeline <small>today</small></h3><div class="timeline">${threats.slice(0,6).map(t=>`<div class="tl ${t.sev==='Critical'?'c':''}"><b>${t.time} · ${t.title}</b><span>${t.cat} · ${t.host}</span></div>`).join('')}</div></div>
<div class="card"><h3>Threat categories</h3>${cats.map((c,i)=>{const n=[6,9,14,3,4,2,3][i];return `<div style="margin-bottom:10px"><div class="row spread"><span>${c}</span><b>${n}</b></div><div class="bar"><i style="width:${n/14*100}%"></i></div></div>`}).join('')}</div></div>`}
function incident(id){const t=threats.find(x=>x.id===id)||threats[0];
return `<div class="row"><a class="btn" href="#/threats">← Back</a><h2 style="font-size:20px">${t.id} · ${t.title}</h2>${pill(t.sev)}</div>
<div class="grid g2"><div class="grid"><div class="card"><h3>Description</h3><p>${t.title}. The detection engine correlated ${3+t.title.length%5} events on <b>${t.host}</b> within 14 minutes. Behaviour matches the <b>${t.cat}</b> pattern with 92% confidence. Review the timeline and decide whether to isolate the device.</p>
<div class="grid g4" style="margin-top:14px;grid-template-columns:repeat(2,1fr)"><div><div class="muted">Date & time</div><b>23 Nov 2026 · ${t.time}</b></div><div><div class="muted">Assigned analyst</div><b>${t.analyst}</b></div><div><div class="muted">Affected device</div><b>${t.host}</b></div><div><div class="muted">Resolution status</div>${stat(t.status)}</div></div></div>
<div class="card"><h3>Activity timeline</h3><div class="timeline"><div class="tl c"><b>${t.time} · Alert raised</b><span>Detection rule R-${100+t.title.length}</span></div><div class="tl"><b>+2 min · Auto-enrichment</b><span>Threat intelligence match, IP reputation: poor</span></div><div class="tl"><b>+6 min · Assigned to ${t.analyst}</b><span>SLA: respond within 30 min</span></div><div class="tl"><b>+11 min · Comment</b><span>"Checking recent logins and file changes on host."</span></div><div class="tl g"><b>Pending · Containment</b><span>Awaiting analyst action</span></div></div></div></div>
<div class="card" style="align-self:start"><h3>Actions</h3><div style="display:grid;gap:10px"><button class="btn primary" onclick="toast('Device ${t.host} isolated (demo)')">Isolate device</button><button class="btn" onclick="toast('Incident escalated (demo)')">Escalate to lead</button><button class="btn" onclick="toast('Marked as contained (demo)')">Mark as contained</button><button class="btn danger" onclick="toast('Closed as false positive (demo)')">Close as false positive</button></div><label class="l">Add a note</label><input class="f" placeholder="Write a comment…"></div></div>`}
function network(){seed=5;return `<div class="grid g4"><div class="card kpi"><div class="l">Connected devices</div><div class="v">${devices.length}</div></div><div class="card kpi"><div class="l">Online / offline</div><div class="v">${devices.filter(d=>d.online).length} / ${devices.filter(d=>!d.online).length}</div></div><div class="card kpi"><div class="l">Open vulnerabilities</div><div class="v" style="color:var(--high)">${devices.reduce((a,d)=>a+d.vul,0)}</div></div><div class="card kpi"><div class="l">Firewall</div><div class="v" style="color:var(--low)">Active</div></div></div>
<div class="grid g2"><div class="card"><h3>Network traffic overview <small>inbound vs outbound · Gbps</small></h3>${line(tr(24,i=>30+Math.round(Math.sin(i/3)*15+rnd()*20)),560,170)}</div><div class="card"><h3>Top protocols</h3>${[['HTTPS',58],['DNS',17],['SSH',9],['SMB',9],['Other',7]].map(p=>`<div style="margin-bottom:10px"><div class="row spread"><span>${p[0]}</span><b>${p[1]}%</b></div><div class="bar"><i style="width:${p[1]}%;background:var(--accent2)"></i></div></div>`).join('')}</div></div>
<div class="card"><h3>Devices</h3><div class="tablewrap"><table><tr><th>Device</th><th>Type</th><th>IP address</th><th>Health</th><th>Status</th><th>Vulnerabilities</th></tr>${devices.map(d=>`<tr><td><b>${d.name}</b></td><td>${d.type}</td><td>${d.ip}</td><td style="min-width:130px"><div class="row"><div class="bar" style="flex:1"><i style="width:${d.health}%;background:${d.health>80?'var(--low)':d.health>60?'var(--med)':'var(--crit)'}"></i></div><b>${d.health}%</b></div></td><td>${d.online?'<span class="pill ok">● Online</span>':'<span class="pill off">○ Offline</span>'}</td><td>${d.vul?pill(d.vul>4?'High':'Medium').replace(/>(High|Medium)</,`>${d.vul} found<`):'<span class="muted">None</span>'}</td></tr>`).join('')}</table></div></div>`}
function reports(){const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];const v=[310,280,350,420,390,460,430,520,480,610,570,640];const n=S.range==='12m'?12:S.range==='6m'?6:3;
return `<div class="row spread"><div class="chips">${[['12m','12 months'],['6m','6 months'],['3m','3 months']].map(r=>`<button class="chip ${S.range===r[0]?'on':''}" onclick="S.range='${r[0]}';render()">${r[1]}</button>`).join('')}</div><button class="btn primary" onclick="toast('Report downloaded as PDF (demo)')">⬇ Download report</button></div>
<div class="grid g2"><div class="card"><h3>Threat trends <small>incidents per month</small></h3>${line(v.slice(-n),560,180)}</div><div class="card"><h3>Attack statistics</h3><div class="row" style="gap:18px">${donut([['Phishing',34,'var(--accent)'],['Malware',26,'var(--accent2)'],['Brute force',21,'var(--high)'],['DDoS',12,'var(--crit)'],['Other',7,'var(--muted)']],150)}<div style="display:grid;gap:6px;font-size:13px">${[['Phishing','34%','var(--accent)'],['Malware','26%','var(--accent2)'],['Brute force','21%','var(--high)'],['DDoS','12%','var(--crit)'],['Other','7%','var(--muted)']].map(x=>`<div><span style="color:${x[2]}">●</span> ${x[0]} <b>${x[1]}</b></div>`).join('')}</div></div></div></div>
<div class="grid g2"><div class="card"><h3>Monthly analytics <small>resolved incidents</small></h3>${bars(v.slice(-n).map(x=>Math.round(x*.82)),m.slice(-n))}</div><div class="card"><h3>Available reports</h3>${[['Executive summary','Nov 2026'],['Vulnerability assessment','Q4 2026'],['Compliance audit','Oct 2026'],['Incident response review','Oct 2026']].map(r=>`<div class="setrow"><div><b>${r[0]}</b><div class="muted">${r[1]}</div></div><button class="btn" onclick="toast('${r[0]} downloaded (demo)')">PDF</button></div>`).join('')}</div></div>`}
function usersView(){return `<div class="row spread"><div class="muted">Role-based access for your security team.</div><button class="btn primary" onclick="toast('Add user form opened (demo)')">+ Add user</button></div>
<div class="grid g2"><div class="card"><h3>Users</h3><div class="tablewrap"><table><tr><th>Name</th><th>Role</th><th>Status</th><th>Last active</th><th></th></tr>${users.map(u=>`<tr><td><b>${u[0]}</b></td><td>${u[1]}</td><td><span class="pill ${u[2]==='Active'?'ok':u[2]==='Invited'?'Medium':'off'}">${u[2]}</span></td><td>${u[3]}</td><td><button class="btn" onclick="toast('Editing ${u[0]} (demo)')">Edit</button></td></tr>`).join('')}</table></div></div>
<div class="card"><h3>Permissions · Analyst</h3>${[['View threats',1],['Manage incidents',1],['Isolate devices',0],['Export reports',1],['Manage users',0]].map(p=>`<div class="setrow"><span>${p[0]}</span><button class="switch ${p[1]?'on':''}" onclick="this.classList.toggle('on')" aria-label="${p[0]}"></button></div>`).join('')}</div></div>
<div class="card"><h3>Activity log</h3>${[['09:12','Elira Hoxha','signed in from Tirana, AL'],['08:47','Marko Petrov','isolated device WS-DEV-087'],['08:30','Dea Krasniqi','exported "Executive summary"'],['Yesterday','Elira Hoxha','changed role of Ardit Balla to Auditor']].map(l=>`<div class="setrow"><span><b>${l[1]}</b> ${l[2]}</span><span class="muted">${l[0]}</span></div>`).join('')}</div>`}
function settings(){return `<div class="grid g2e"><div class="card"><h3>Profile settings</h3><label class="l">Full name</label><input class="f" value="Elira Hoxha"><label class="l">Email</label><input class="f" value="elira.hoxha@aegisops.io"><label class="l">Role</label><input class="f" value="Security Admin" disabled><div style="margin-top:16px"><button class="btn primary" onclick="toast('Profile saved')">Save changes</button></div></div>
<div class="card"><h3>Theme</h3><div class="chips"><button class="chip ${S.theme==='dark'?'on':''}" onclick="setTheme('dark')">🌙 Dark</button><button class="chip ${S.theme==='light'?'on':''}" onclick="setTheme('light')">☀ Light</button></div><h3 style="margin-top:22px">Notification preferences</h3>${[['Critical alerts',1],['Daily digest email',1],['Device offline',0],['Weekly report',1]].map(p=>`<div class="setrow"><span>${p[0]}</span><button class="switch ${p[1]?'on':''}" onclick="this.classList.toggle('on')" aria-label="${p[0]}"></button></div>`).join('')}</div></div>
<div class="card"><h3>Security settings</h3>${[['Two-factor authentication',1],['Require re-login after 30 min idle',1],['Alert on new sign-in location',1]].map(p=>`<div class="setrow"><span>${p[0]}</span><button class="switch ${p[1]?'on':''}" onclick="this.classList.toggle('on')" aria-label="${p[0]}"></button></div>`).join('')}<div style="margin-top:16px"><button class="btn danger" onclick="go('login')">Log out</button></div></div>`}
function design(){const sw=(n,v,t='#fff')=>`<div class="sw" style="background:${v};color:${t}">${n}<br>${v}</div>`;
return `<div class="card"><h3>Colour palette (dark)</h3><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">${sw('Background','#0A0F1C')}${sw('Panel','#111A2E')}${sw('Panel 2','#16213A')}${sw('Accent','#38BDF8','#0A0F1C')}${sw('Accent 2','#6366F1')}${sw('Critical','#FF5C7A','#0A0F1C')}${sw('High','#FF9F43','#0A0F1C')}${sw('Medium','#F5D547','#0A0F1C')}${sw('Low','#34D399','#0A0F1C')}</div><p class="muted" style="margin-top:10px">Text #E6ECFA on panel #111A2E = 14.2:1 contrast. Severity colours never carry meaning alone: every badge also shows its label.</p></div>
<div class="grid g2e"><div class="card"><h3>Typography · Inter / Segoe UI</h3><div style="font-size:30px;font-weight:700">Display 30 / Bold</div><div style="font-size:20px;font-weight:700">Heading 20 / Bold</div><div style="font-size:14px">Body 14 / Regular – readable data-heavy tables</div><div class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.05em">Caption 12 / Uppercase</div></div>
<div class="card"><h3>Buttons & badges</h3><div class="row"><button class="btn primary">Primary</button><button class="btn">Secondary</button><button class="btn danger">Danger</button></div><div class="row" style="margin-top:14px">${sevs.map(pill).join('')}<span class="pill ok">● Online</span><span class="pill off">○ Offline</span></div><div class="row" style="margin-top:14px"><button class="chip on">Selected</button><button class="chip">Chip</button><button class="switch on" aria-label="on"></button><button class="switch" aria-label="off"></button></div></div></div>
<div class="grid g2e"><div class="card"><h3>Icons</h3><div class="row" style="font-size:24px;gap:18px">🛡 ▦ ⚠ 🖧 📈 👥 ⚙ 🔔 ⬇ 🔍</div><p class="muted" style="margin-top:8px">Concept set using system glyphs; replace with a single stroke-icon family (24px grid, 1.75px stroke) in Figma.</p></div>
<div class="card"><h3>Spacing & radius</h3><div class="row" style="align-items:flex-end">${[4,8,12,16,24,32].map(s=>`<div style="text-align:center"><div style="width:${s}px;height:${s}px;background:var(--accent);border-radius:3px;margin:auto"></div><small class="muted">${s}</small></div>`).join('')}</div><p class="muted" style="margin-top:10px">8-pt scale · card radius 12px · control radius 10px · gutter 16px · page padding 26px</p></div></div>`}
const TITLES={dashboard:'Security overview',threats:'Threat monitoring',network:'Devices & network',reports:'Reports & analytics',users:'User management',settings:'Settings',design:'Design system'};
function render(keepFocus){const r=S.route;const root=document.getElementById('root');
if(r==='login'){root.innerHTML=login()+(S.toast?`<div class="toast">${S.toast}</div>`:'');return}
const id=r.startsWith('incident/')?r.split('/')[1]:null;const key=id?'threats':r;
const body=id?incident(id):({dashboard,threats:threatsView,network,reports,users:usersView,settings,design})[r]?.()||dashboard();
const active=key;
root.innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="logo">🛡</div><span class="t">AegisOps</span></div><nav class="nav">${NAV.map(n=>`<a href="#/${n[0]}" class="${active===n[0]?'on':''}" title="${n[2]}"><span class="ico">${n[1]}</span><span class="t">${n[2]}</span></a>`).join('')}<a href="#/design" class="${active==='design'?'on':''}" title="Design system"><span class="ico">🎨</span><span class="t">Design system</span></a></nav><div class="foot">v2.4 · Last sync 12 s ago</div></aside>
<div class="main"><div class="tabs">${NAV.map(n=>`<a href="#/${n[0]}" class="${active===n[0]?'on':''}">${n[2]}</a>`).join('')}</div><header class="top"><h1>${id?'Incident details':TITLES[r]||'Dashboard'}</h1><input class="search" placeholder="Search devices, users, incidents…" aria-label="Global search"><button class="iconbtn" aria-label="Toggle theme" onclick="setTheme(S.theme==='dark'?'light':'dark')">${S.theme==='dark'?'☀':'🌙'}</button><button class="iconbtn" aria-label="Notifications" onclick="S.notif=!S.notif;render()">🔔<span class="dot"></span></button><div class="avatar" title="Elira Hoxha">EH</div></header>
<main class="content">${body}</main></div></div>
${S.notif?`<div class="panel" role="dialog" aria-label="Notifications"><h3 style="margin-bottom:6px">Notifications <small class="muted" style="font-weight:400">· live</small></h3>${threats.slice(0,4).map(t=>`<div class="n"><div class="row spread">${pill(t.sev)}<span class="muted">${t.time}</span></div><div style="margin-top:6px">${t.title}</div></div>`).join('')}</div>`:''}
${S.toast?`<div class="toast" role="status">${S.toast}</div>`:''}`;
if(keepFocus){const i=document.getElementById('tq');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}}
render();
</script>
</body>
</html>
